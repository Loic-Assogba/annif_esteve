<!doctype html>
<html lang="fr" class="scroll-smooth">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Estève Zannou | Happy Birthday</title>

        <!-- Tailwind CSS -->
        <script src="https://cdn.tailwindcss.com"></script>

        <!-- Google Font -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
            rel="stylesheet"
        />

        <!-- Lucide Icons -->
        <script src="https://unpkg.com/lucide@latest"></script>

        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        fontFamily: {
                            sans: ['Poppins', 'sans-serif'],
                        },
                        colors: {
                            primary: '#f97316',
                        },
                    },
                },
            };
        </script>
    </head>

    <body class="bg-slate-950 text-white font-sans">
        <!-- ================= HEADER ================= -->

        <header
            id="header"
            class="fixed top-0 left-0 w-full z-50 transition-all duration-300"
        >
            <nav
                class="max-w-7xl mx-auto flex items-center justify-between px-6 lg:px-8 h-20"
            >
                <!-- Logo -->

                <a href="#" class="flex items-center gap-3">
                    <div
                        class="w-12 h-12 rounded-xl bg-primary flex items-center justify-center font-bold text-xl shadow-lg"
                    >
                        EZ
                    </div>

                    <div>
                        <h2 class="font-bold text-lg">Estève Zannou</h2>

                        <p class="text-xs text-gray-400">
                            Happy Birthday Portfolio
                        </p>
                    </div>
                </a>

                <!-- Desktop Menu -->

                <ul class="hidden lg:flex items-center gap-8">
                    <li>
                        <a href="#home" class="hover:text-primary transition">
                            Accueil
                        </a>
                    </li>

                    <li>
                        <a href="#about" class="hover:text-primary transition">
                            À propos
                        </a>
                    </li>

                    <li>
                        <a href="#skills" class="hover:text-primary transition">
                            Compétences
                        </a>
                    </li>

                    <li>
                        <a
                            href="#portfolio"
                            class="hover:text-primary transition"
                        >
                            Portfolio
                        </a>
                    </li>

                    <li>
                        <a
                            href="#contact"
                            class="hover:text-primary transition"
                        >
                            Contact
                        </a>
                    </li>
                </ul>

                <!-- Contact Button -->

                <a
                    href="#contact"
                    class="hidden lg:flex bg-primary px-5 py-3 rounded-full font-medium hover:scale-105 transition"
                >
                    Me contacter
                </a>

                <!-- Burger -->

                <button id="menu-btn" class="lg:hidden">
                    <i data-lucide="menu" class="w-8 h-8"></i>
                </button>
            </nav>
        </header>

        <!-- ================= MOBILE MENU ================= -->

        <aside
            id="mobile-menu"
            class="fixed top-0 right-[-100%] w-72 h-screen bg-slate-900 z-40 transition-all duration-500 shadow-2xl"
        >
            <div
                class="flex justify-between items-center p-6 border-b border-slate-700"
            >
                <h2 class="font-bold">Menu</h2>

                <button id="close-menu">
                    <i data-lucide="x"></i>
                </button>
            </div>

            <nav class="flex flex-col p-6 gap-6">
                <a href="#home">Accueil</a>

                <a href="#about">À propos</a>

                <a href="#skills">Compétences</a>

                <a href="#portfolio">Portfolio</a>

                <a href="#contact">Contact</a>

                <a
                    href="#contact"
                    class="bg-primary py-3 rounded-xl text-center mt-4"
                >
                    Me contacter
                </a>
            </nav>
        </aside>

        <!-- Overlay -->

        <div id="overlay" class="fixed inset-0 bg-black/60 hidden z-30"></div>

        <!-- Démo -->

        <main class="pt-32">
            <section class="h-screen flex items-center justify-center">
                <h1 class="text-4xl lg:text-6xl font-bold">Bienvenue 👋</h1>
            </section>
        </main>

        <!-- ================= JS ================= -->

        <script>
            lucide.createIcons();

            const menuBtn = document.getElementById('menu-btn');

            const closeBtn = document.getElementById('close-menu');

            const mobileMenu = document.getElementById('mobile-menu');

            const overlay = document.getElementById('overlay');

            function openMenu() {
                mobileMenu.style.right = '0';

                overlay.classList.remove('hidden');
            }

            function closeMenu() {
                mobileMenu.style.right = '-100%';

                overlay.classList.add('hidden');
            }

            menuBtn.addEventListener('click', openMenu);

            closeBtn.addEventListener('click', closeMenu);

            overlay.addEventListener('click', closeMenu);

            // Header au scroll

            const header = document.getElementById('header');

            window.addEventListener('scroll', () => {
                if (window.scrollY > 50) {
                    header.classList.add(
                        'backdrop-blur-xl',
                        'bg-slate-900/70',
                        'border-b',
                        'border-slate-800'
                    );
                } else {
                    header.classList.remove(
                        'backdrop-blur-xl',
                        'bg-slate-900/70',
                        'border-b',
                        'border-slate-800'
                    );
                }
            });
        </script>
    </body>
</html>
